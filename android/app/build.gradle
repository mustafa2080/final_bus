plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.kidsbus.mybus"
    compileSdk = 36
    compileSdkVersion = 36
    ndkVersion = "28.2.13676358"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
        // تحسين عملية الترجمة
        incremental = true
        // تفعيل core library desugaring للمكتبات الحديثة
        coreLibraryDesugaringEnabled = true
    }

    kotlinOptions {
        jvmTarget = "11"
        // تحسينات Kotlin للسرعة
        freeCompilerArgs += [
            "-opt-in=kotlin.RequiresOptIn",
            "-Xjvm-default=all"
        ]
    }

    // Build speed optimizations (updated for modern AGP)
    packaging {
        resources {
            pickFirsts += ['**/libc++_shared.so', '**/libjsc.so']
            excludes += [
                '/META-INF/{AL2.0,LGPL2.1}',
                '/META-INF/DEPENDENCIES',
                '/META-INF/LICENSE',
                '/META-INF/LICENSE.txt',
                '/META-INF/NOTICE',
                '/META-INF/NOTICE.txt'
            ]
        }
    }

    // تحسينات إضافية للسرعة
    buildFeatures {
        buildConfig = true
        viewBinding = false
        dataBinding = false
    }

    defaultConfig {
        applicationId = "com.kidsbus.mybus"
        minSdkVersion = flutter.minSdkVersion
        targetSdk = 36
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        multiDexEnabled = true

        // دعم المعماريات الشائعة: arm64-v8a للأجهزة الحديثة (64-bit) و
        // armeabi-v7a للأجهزة الأقدم/الأرخص المنتشرة في السوق. استبعاد
        // armeabi-v7a كان سيمنع نسبة لا بأس بها من مستخدمي أندرويد
        // القدامى من تحميل/تشغيل التطبيق من المتجر.
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }

        // تحسينات إضافية للسرعة
        vectorDrawables.useSupportLibrary = true

        // تحسين عملية البناء
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"

        // تسريع البناء للتطوير
        resConfigs "en", "ar"
    }

    signingConfigs {
        release {
            keyAlias = keystoreProperties['keyAlias']
            keyPassword = keystoreProperties['keyPassword']
            storeFile = keystoreProperties['storeFile'] ? file("${project.projectDir}/${keystoreProperties['storeFile']}") : null
            storePassword = keystoreProperties['storePassword']
        }
    }

    buildTypes {
        debug {
            minifyEnabled = false
            shrinkResources = false
            debuggable = true
            // تحسينات للسرعة في وضع التطوير
            crunchPngs = false
            zipAlignEnabled = false
            // تسريع عملية البناء
            renderscriptOptimLevel = 0
            // تسريع إضافي للتطوير
            pseudoLocalesEnabled = false
            // تعطيل optimizations للسرعة
            jniDebuggable = false
        }
        release {
            signingConfig = signingConfigs.release
            minifyEnabled = true
            shrinkResources = true
            debuggable = false
            crunchPngs = true
            zipAlignEnabled = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"

    // Firebase dependencies
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-messaging-ktx'
    implementation 'com.google.firebase:firebase-analytics-ktx'

    // AndroidX dependencies
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'

    // Core library desugaring للدعم المتقدم للمكتبات
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
    // MultiDex support للتطبيقات الكبيرة
    implementation 'androidx.multidex:multidex:2.0.1'
}

// Google Services plugin تم تطبيقه في plugins block أعلاه
